name: Build Lua 5.5.0 macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: macos-13
            deployment_target: 10.11
          - arch: arm64
            runs-on: macos-14
            deployment_target: 11.0
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar fonte do Lua 5.5.0
        run: |
          curl -LO https://www.lua.org/ftp/lua-5.5.0.tar.gz
          tar xzf lua-5.5.0.tar.gz

      - name: Compilar para ${{ matrix.arch }}
        run: |
          cd lua-5.5.0
          export MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          make macosx CC="clang -arch ${{ matrix.arch }}"

      - name: Empacotar e salvar na pasta correta
        run: |
          cd lua-5.5.0
          mkdir -p ../releases/download/v.5.5.0/macos/${{ matrix.arch }}
          cp src/lua src/luac src/liblua.a ../releases/download/v.5.5.0/macos/${{ matrix.arch }}/
          cd ../releases/download/v.5.5.0/macos/${{ matrix.arch }}
          tar czf lua-5.5.0_macOS_${{ matrix.arch }}.tar.gz .

      - name: Commit e push dos binários
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add releases/download/v.5.5.0/macos/${{ matrix.arch }}/lua-5.5.0_macOS_${{ matrix.arch }}.tar.gz
          git commit -m "Add Lua 5.5.0 macOS ${{ matrix.arch }} binaries" || echo "Nada para commitar"
          git push
