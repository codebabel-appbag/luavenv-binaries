name: Build Lua 5.5.0 macOS

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-latest
    steps:
      - name: Baixar fonte do Lua 5.5.0
        run: |
          curl -LO https://www.lua.org/ftp/lua-5.5.0.tar.gz
          tar xzf lua-5.5.0.tar.gz
          cd lua-5.5.0

      - name: Compilar para ${{ matrix.arch }}
        run: |
          cd lua-5.5.0
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make macosx CC="clang -arch arm64"
          else
            make macosx CC="clang -arch x86_64"
          fi

      - name: Empacotar binários
        run: |
          cd lua-5.5.0
          mkdir -p dist
          cp src/lua src/luac src/liblua.a dist/
          tar czf lua-5.5.0_macOS_${{ matrix.arch }}.tar.gz -C dist .

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: lua-5.5.0-macos-${{ matrix.arch }}
          path: lua-5.5.0/lua-5.5.0_macOS_${{ matrix.arch }}.tar.gz
